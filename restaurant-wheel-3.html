<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>今天吃什么？三选一转盘</title>
<style>
:root{--bg:#fff8ed;--ink:#402312}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#fffdf7 0,#fff8ed 52%,#f7ead5 100%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;justify-content:center}.app{width:min(100%,560px);padding:24px 16px 40px;text-align:center}h1{margin:4px 0 2px;font-size:clamp(34px,9vw,52px)}.sub{font-weight:700;opacity:.68;margin-bottom:18px}.wheel-wrap{position:relative;width:min(92vw,520px);aspect-ratio:1;margin:0 auto;filter:drop-shadow(0 18px 28px rgba(101,57,23,.18))}canvas{width:100%;height:100%;display:block}.pointer{position:absolute;left:50%;top:-2px;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:48px solid #ff4b2b;filter:drop-shadow(0 4px 2px rgba(0,0,0,.22));z-index:3}.hub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:27%;aspect-ratio:1;border-radius:50%;border:7px solid #ffd06b;background:linear-gradient(#ff765c,#e93820);box-shadow:0 8px 15px rgba(98,32,12,.3),inset 0 3px 0 rgba(255,255,255,.4);color:#fff;font-weight:900;font-size:clamp(18px,5vw,28px);display:grid;place-items:center;z-index:2;cursor:pointer;user-select:none}.hub:active{transform:translate(-50%,-50%) scale(.96)}.result{margin:20px auto 12px;padding:14px 16px;min-height:60px;border-radius:18px;background:rgba(255,255,255,.86);box-shadow:0 7px 18px rgba(90,48,18,.09);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center}.result strong{font-size:24px;margin-left:6px}button{border:0;border-radius:16px;background:#2c211a;color:#fff;font-size:18px;font-weight:800;padding:14px 26px;box-shadow:0 7px 0 #140f0c;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 3px 0 #140f0c}button:disabled{opacity:.55}.note{font-size:13px;opacity:.55;margin-top:16px}</style>
</head>
<body>
<main class="app">
<h1>今天吃什么？</h1><div class="sub">🥢 三选一 · 随机转盘</div>
<div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel"></canvas><div class="hub" id="hub">点击<br>开始</div></div>
<div class="result" id="result">点一下转盘，让它替你决定 👆</div><button id="spinBtn">转一次</button><div class="note">农家一碗香 · 拆骨肉 · 小炒肉，每项概率相同。</div>
</main>
<script>
const items=['农家一碗香','拆骨肉','小炒肉'];
const colors=['#f28b3c','#e25345','#6fa85b'];
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d'),result=document.getElementById('result'),spinBtn=document.getElementById('spinBtn'),hub=document.getElementById('hub');
let rotation=0,spinning=false;const TAU=Math.PI*2,seg=TAU/items.length;
function fit(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);draw()}
function draw(){const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=Math.min(w,h)*.47;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(cx,cy);ctx.rotate(rotation);for(let i=0;i<items.length;i++){const center=-Math.PI/2+i*seg,a0=center-seg/2,a1=center+seg/2;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,a0,a1);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.lineWidth=Math.max(4,w*.006);ctx.strokeStyle='#fff4d8';ctx.stroke();ctx.save();ctx.rotate(center);ctx.translate(r*.62,0);ctx.rotate(Math.PI/2);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(45,26,9,.35)';ctx.shadowBlur=w*.006;ctx.shadowOffsetY=w*.004;ctx.font=`900 ${w*.05}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`;ctx.fillText(items[i],0,0);ctx.restore()}ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.lineWidth=Math.max(14,w*.022);ctx.strokeStyle='#70401f';ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*1.035,0,TAU);ctx.lineWidth=Math.max(8,w*.012);ctx.strokeStyle='#f6b93b';ctx.stroke();ctx.restore()}
function pick(){if(crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%items.length}return Math.floor(Math.random()*items.length)}
function ease(t){return 1-Math.pow(1-t,3)}
function spin(){if(spinning)return;spinning=true;spinBtn.disabled=true;hub.style.pointerEvents='none';result.textContent='正在转……';const chosen=pick(),start=rotation,startMod=((start%TAU)+TAU)%TAU,desired=((-chosen*seg%TAU)+TAU)%TAU,delta=((desired-startMod)+TAU)%TAU,end=start+(7+Math.floor(Math.random()*3))*TAU+delta,dur=4000+Math.random()*800,t0=performance.now();function frame(now){const t=Math.min(1,(now-t0)/dur);rotation=start+(end-start)*ease(t);draw();if(t<1)requestAnimationFrame(frame);else{rotation=end%TAU;draw();spinning=false;spinBtn.disabled=false;hub.style.pointerEvents='auto';result.innerHTML=`今天吃：<strong>${items[chosen]}</strong> 🎉`;if(navigator.vibrate)navigator.vibrate([60,40,100])}}requestAnimationFrame(frame)}
spinBtn.onclick=spin;hub.onclick=spin;window.addEventListener('resize',fit,{passive:true});requestAnimationFrame(fit);
</script>
</body></html>
